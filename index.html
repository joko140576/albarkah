<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Display Multimedia</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    /* --- FORM INPUT --- */
    #inputPage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 12px;
    }
    #inputPage input, #inputPage textarea, #inputPage button {
      padding: 8px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    #inputPage button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* --- DISPLAY PAGE --- */
    #displayPage {
      display: none;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto auto; /* video+image | jadwal | running */
      gap: 6px;
      padding: 6px;
      box-sizing: border-box;
    }

    .top-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 6px;
    }

    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    /* --- JADWAL SHOLAT --- */
    .jadwal {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: linear-gradient(135deg, #6dd5ed, #2193b0);
      border-radius: 12px;
      color: #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      font-weight: bold;
      padding: 6px 0;
    }
    .jadwal-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.9rem;
    }
    .jadwal-item span {
      font-size: 1.1rem;
      margin-top: 2px;
    }

    /* --- RUNNING TEXT --- */
    .running-text {
      background: black;
      color: white;
      overflow: hidden;
      white-space: nowrap;
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      height: 2.5em;
    }
    .running-text span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 15s linear infinite;
    }
    @keyframes marquee {
      from { transform: translateX(0%); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <!-- PAGE 1: INPUT -->
  <div id="inputPage">
    <h2>Masukkan File & Teks</h2>
    <label>Video (maks 10): 
      <input type="file" id="videoInput" accept="video/*" multiple>
    </label>
    <label>Gambar (maks 10): 
      <input type="file" id="imageInput" accept="image/*" multiple>
    </label>
    <label>Teks Berjalan:</label>
    <textarea id="textInput" rows="3" cols="30"></textarea>
    <button onclick="mulaiTampilkan()">Mulai Tampilkan</button>
  </div>

  <!-- PAGE 2: DISPLAY -->
  <div id="displayPage">
    <!-- Baris 1 -->
    <div class="top-row">
      <video id="videoPlayer" autoplay muted></video>
      <img id="imageDisplay" alt="gambar looping">
    </div>

    <!-- Baris 2: Jadwal Sholat -->
    <div class="jadwal">
      <div class="jadwal-item">🌙<span>Subuh: 04:30</span></div>
      <div class="jadwal-item">☀️<span>Dzuhur: 12:00</span></div>
      <div class="jadwal-item">🌤️<span>Ashar: 15:30</span></div>
      <div class="jadwal-item">🌇<span>Maghrib: 18:00</span></div>
      <div class="jadwal-item">🌌<span>Isya: 19:15</span></div>
    </div>

    <!-- Baris 3: Running text -->
    <div class="running-text">
      <span id="runningText"></span>
    </div>
  </div>

  <script>
    let videoFiles = [];
    let imageFiles = [];
    let currentVideo = 0;
    let currentImage = 0;
    let imageInterval;

    function mulaiTampilkan() {
      const videoInput = document.getElementById("videoInput").files;
      const imageInput = document.getElementById("imageInput").files;
      const text = document.getElementById("textInput").value;

      if (videoInput.length === 0 || imageInput.length === 0 || !text) {
        alert("Isi semua input dulu ya!");
        return;
      }

      // simpan file video (maks 10)
      videoFiles = Array.from(videoInput).slice(0, 10);
      // simpan file gambar (maks 10)
      imageFiles = Array.from(imageInput).slice(0, 10);

      // set teks berjalan
      document.getElementById("runningText").textContent = text;

      // tampilkan halaman display
      document.getElementById("inputPage").style.display = "none";
      document.getElementById("displayPage").style.display = "grid";

      // mulai video loop
      playVideo();

      // mulai gambar loop
      startImageLoop();
    }

    function playVideo() {
      if (videoFiles.length === 0) return;
      const videoPlayer = document.getElementById("videoPlayer");
      const url = URL.createObjectURL(videoFiles[currentVideo]);
      videoPlayer.src = url;
      videoPlayer.play();

      videoPlayer.onended = function() {
        currentVideo = (currentVideo + 1) % videoFiles.length;
        playVideo();
      };
    }

    function startImageLoop() {
      if (imageFiles.length === 0) return;
      const imageDisplay = document.getElementById("imageDisplay");

      function showImage() {
        const url = URL.createObjectURL(imageFiles[currentImage]);
        imageDisplay.src = url;
        currentImage = (currentImage + 1) % imageFiles.length;
      }

      showImage(); // tampilkan pertama kali
      clearInterval(imageInterval);
      imageInterval = setInterval(showImage, 5000); // ganti tiap 5 detik
    }
  </script>

</body>
</html>
