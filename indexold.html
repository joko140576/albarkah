<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Layar Informasi Masjid</title>
  <style>
    body {
      margin: 0;
      background: #e0e0e0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Halaman input */
    #inputPage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      padding: 20px;
    }

    #inputPage h2 {
      margin-bottom: 10px;
    }

    /* Layout utama */
    #displayPage {
      display: none;
      flex: 1;
      flex-direction: column;
      height: 100%;
    }

    .top-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
      flex: 1;
      padding: 8px;
    }

    .frame {
      background: #fff;
      border-radius: 12px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video, img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Baris 2: Jadwal sholat */
    .prayer-row {
      display: grid;
      grid-template-columns: 1fr 3fr;
      background: linear-gradient(90deg, #3bc9db, #4dabf7);
      color: white;
      font-weight: bold;
      border-top: 2px solid #1971c2;
      border-bottom: 2px solid #1971c2;
      margin-top: -20px;
    }

    .time-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-right: 2px solid #1971c2;
    }

    #digitalClock {
      font-size: 28px;
    }

    #dateNow {
      font-size: 16px;
      margin-top: 4px;
    }

    .prayer-times {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0;
      font-size: 24px;
      line-height: 2;
    }

    .prayer-times div {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .prayer-times span {
      font-size: 16px;
    }

    /* Baris 3: Running text */
    .running-text {
      background: #222;
      color: yellow;
      font-size: 24px;
      font-weight: bold;
      height: 12vh;        /* lebih ramping */
      line-height: 10vh;
      display: flex; 
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      border-top: 5px solid #555;
      margin-top: 5px;    /* turun sedikit */
    }

    .running-text span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 25s linear infinite;
    }

    @keyframes marquee {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <!-- Halaman Input -->
  <div id="inputPage">
    <h2>Masukkan File Multimedia</h2>
    <label>Video (maks 10): <input type="file" id="videoInput" accept="video/*" multiple></label>
    <label>Gambar (maks 10): <input type="file" id="imageInput" accept="image/*" multiple></label>
    <label>Running Text: <input type="text" id="textInput" placeholder="Tulis pesan berjalan di sini"></label>
    <button onclick="startDisplay()">Mulai</button>
  </div>

  <!-- Halaman Display -->
  <div id="displayPage">
    <!-- Baris 1 -->
    <div class="top-row">
      <div class="frame">
        <video id="videoPlayer" autoplay muted></video>
      </div>
      <div class="frame">
        <img id="imageDisplay" alt="Gambar tampil di sini" />
      </div>
    </div>

    <!-- Baris 2: Jadwal Sholat -->
    <div class="prayer-row">
      <!-- Kolom kiri -->
      <div class="time-column">
        <div id="digitalClock">00:00:00</div>
        <div id="dateNow">Tanggal</div>
      </div>
      <!-- Kolom kanan -->
      <div class="prayer-times">
        <div>🕌 Subuh <span>04:30</span></div>
        <div>🌞 Dzuhur <span>12:00</span></div>
        <div>🌇 Ashar <span>15:30</span></div>
        <div>🌆 Maghrib <span>18:00</span></div>
        <div>🌙 Isya <span>19:15</span></div>
      </div>
    </div>

    <!-- Baris 3: Running Text -->
    <div class="running-text">
      <span id="runningText">Selamat datang di layar informasi masjid 🌙</span>
    </div>
  </div>

  <script>
    let videoFiles = [];
    let imageFiles = [];
    let currentVideo = 0;
    let currentImage = 0;

    function startDisplay() {
      videoFiles = Array.from(document.getElementById("videoInput").files).slice(0, 10);
      imageFiles = Array.from(document.getElementById("imageInput").files).slice(0, 10);
      const text = document.getElementById("textInput").value;

      document.getElementById("inputPage").style.display = "none";
      document.getElementById("displayPage").style.display = "flex";

      if (text) {
        document.getElementById("runningText").textContent = text;
      }

      if (videoFiles.length > 0) {
        playVideo();
      }

      if (imageFiles.length > 0) {
        showImage();
        setInterval(nextImage, 4000);
      }
    }

    function playVideo() {
      const videoPlayer = document.getElementById("videoPlayer");
      videoPlayer.src = URL.createObjectURL(videoFiles[currentVideo]);
      videoPlayer.play();

      videoPlayer.onended = function() {
        currentVideo = (currentVideo + 1) % videoFiles.length;
        playVideo();
      };
    }

    function showImage() {
      const imageDisplay = document.getElementById("imageDisplay");
      imageDisplay.src = URL.createObjectURL(imageFiles[currentImage]);
    }

    function nextImage() {
      currentImage = (currentImage + 1) % imageFiles.length;
      showImage();
    }

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById("digitalClock").textContent = `${h}:${m}:${s}`;

      // Tanggal Masehi (Bahasa Indonesia)
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const masehi = now.toLocaleDateString('id-ID', options);
      document.getElementById("dateNow").textContent = masehi;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
